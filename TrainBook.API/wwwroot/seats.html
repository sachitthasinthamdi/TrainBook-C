<body data-page="seats">
<nav class="navbar"><div class="container">
  <a class="logo" href="index.html">🚆 TrainBook</a>
  <ul class="nav-links">

    <li><a href="history.html">ประวัติการจอง</a></li>

<div class="container page-wrap">
  <h2 class="page-title">เลือกที่นั่ง</h2>
  <p class="page-sub" id="seatTrip"></p>

  <div class="seat-layout">
    <div class="card">
      <div style="font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:6px;">หน้ารถ 🚆</div>
      <div class="seat-map" id="seatMap"></div>

      </div>
      <button class="btn-primary btn-full" id="seatNext">ถัดไป</button>
      <a class="btn-ghost btn-full" href="search.html" style="margin-top:10px;display:block;text-align:center;">← เลือกเที่ยวรถใหม่</a>
